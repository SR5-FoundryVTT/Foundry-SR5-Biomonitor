name: Module CI/CD

on: 
  push:
    branches:
      - main

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    # Get the version from the source 'module.json'
    - name: Get Version
      shell: bash
      id: get-version
      # Note: updated to use modern $GITHUB_OUTPUT instead of deprecated set-output
      run: echo "version=$(node ./.github/workflows/get-version.js)" >> $GITHUB_OUTPUT

    # Substitute Manifest and Download URLs in the BUILT module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: './dist/module.json'
      env:
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/download/${{steps.get-version.outputs.version}}/module.zip
    
    # Create a zip file from the 'dist' folder AFTER variable substitution
    - name: Zip Files
      working-directory: ./dist
      run: zip -r ../module.zip .

    # Create a release for this specific version
    - name: Create Version Release
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true 
        name: Release ${{ steps.get-version.outputs.version }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './dist/module.json,./module.zip'
        tag: ${{ steps.get-version.outputs.version }}

    # Substitute the Manifest and Download URLs for the Latest release
    - name: Substitute Manifest and Download Links For Latest
      id: sub_manifest_link_latest
      uses: microsoft/variable-substitution@v1
      with:
        files: './dist/module.json'
      env:
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/latest/download/module.zip

    # Re-zip with the "latest" targeted module.json
    - name: Re-Zip Files for Latest
      working-directory: ./dist
      run: zip -r ../module.zip .

    # Update the 'latest' release
    - name: Update Latest Release
      id: create_latest_release
      uses: ncipollo/release-action@v1
      if: endsWith(github.ref, 'main')
      with:
        allowUpdates: true
        name: Latest
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        # Uploading the re-zipped file as module.zip so the download link matches
        artifacts: './dist/module.json,./module.zip'
        tag: latest
        artifactErrorsFailBuild: true
